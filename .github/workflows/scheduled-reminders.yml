name: Scheduled reminders (manual trigger only — see note below)

# Vercel Cron Jobs (vercel.json) turned out to be silently unavailable on the Hobby plan — the
# deploy log had zero mention of "cron" anywhere, no error, no warning, just never registered.
# This workflow originally replaced that trigger mechanism with GitHub Actions' own `schedule`
# trigger instead. That didn't work out either: real production data (pulled from this workflow's
# own run history via the GitHub API, 2026-10-04 through 2026-10-17) showed every single scheduled
# run landing 2-7+ hours late — the 8:30am daily summary routinely arriving past noon, the 8:00pm
# check-in routinely arriving after 1am. GitHub documents the `schedule` trigger as best-effort,
# not guaranteed-on-time, and in practice for this account it was far worse than "sometimes
# delayed by minutes" — consistently hours, every day, not occasional platform-load jitter.
#
# **The actual trigger now lives in Supabase** (`pg_cron` + `pg_net`, scheduled directly from the
# project's own Postgres instance via the SQL Editor — see CHANGELOG.md v2.94.3 for the exact SQL
# used). Chosen over this GitHub Actions workflow and over Vercel Cron Jobs (Pro plan, $20/mo):
# `pg_cron` fires at the literal database clock second, with no external best-effort scheduler
# queue in between, on infrastructure this app already depends on for real user data — no new
# paid plan, no third-party service account.
#
# This file is kept only for `workflow_dispatch` — the manual "Run workflow" button in GitHub's
# Actions tab — as a convenient way to re-trigger either route by hand (e.g. to resend a missed
# message, or to smoke-test a deploy) without needing a terminal or production credentials handy.
# Needs the same two values as before, still set in GitHub → repo Settings → Secrets and
# variables → Actions (Variables tab → PRODUCTION_URL, Secrets tab → CRON_SECRET, matching
# Vercel's env var of the same name) — both still used by the manual-dispatch path below.

on:
  workflow_dispatch: {} # manual "Run workflow" button in GitHub's Actions tab, for testing/resend

jobs:
  daily-summary:
    # workflow_dispatch is the only trigger left (see note above) — both jobs just run every time
    # the button is pressed; the old per-schedule `if:` split is gone since there's no longer a
    # second `schedule:` entry to distinguish between.
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/daily-summary
        run: |
          response=$(curl -s -w "\n%{http_code}" -X GET "${{ vars.PRODUCTION_URL }}/api/cron/daily-summary" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')
          echo "Response: $body"
          echo "HTTP status: $http_code"
          if [ "$http_code" -ge 400 ]; then exit 1; fi

  evening-checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/evening-checkin
        run: |
          response=$(curl -s -w "\n%{http_code}" -X GET "${{ vars.PRODUCTION_URL }}/api/cron/evening-checkin" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')
          echo "Response: $body"
          echo "HTTP status: $http_code"
          if [ "$http_code" -ge 400 ]; then exit 1; fi
